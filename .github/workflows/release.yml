name: Release

permissions:
    contents: write
    id-token: write
    attestations: write

on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+"
            - "v[0-9]+.[0-9]+.[0-9]+-*"

env:
    QT_VERSION: "6.11.1"

jobs:
    validate:
        name: Validate Release
        runs-on: ubuntu-latest
        timeout-minutes: 10

        outputs:
            version: ${{ steps.version.outputs.version }}
            tag: ${{ steps.version.outputs.tag }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Determine version
              id: version
              shell: bash
              run: |
                TAG="${GITHUB_REF#refs/tags/}"

                # Validate tag format
                if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
                    echo "Error: Invalid tag format: $TAG"
                    echo "Expected format: v0.0.0 or v0.0.0-suffix"
                    exit 1
                fi

                VERSION="${TAG#v}"
                echo "tag=$TAG" >> "$GITHUB_OUTPUT"
                echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                echo "Release version: $VERSION (tag: $TAG)"

            - name: Verify CMakeLists.txt version matches tag
              shell: bash
              run: |
                CMAKE_VERSION=$(grep 'VERSION ' CMakeLists.txt | head -1 | sed 's/.*VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/')
                TAG_VERSION="${{ steps.version.outputs.version }}"

                # For pre-release tags like v0.1.0-rc1, compare base version
                BASE_TAG_VERSION="${TAG_VERSION%%-*}"

                if [[ "$CMAKE_VERSION" != "$BASE_TAG_VERSION" ]]; then
                    echo "Error: Version mismatch!"
                    echo "  CMakeLists.txt: $CMAKE_VERSION"
                    echo "  Tag:            $BASE_TAG_VERSION"
                    echo ""
                    echo "Update CMakeLists.txt version before tagging."
                    exit 1
                fi

                echo "Version verified: $CMAKE_VERSION"

    build:
        name: Build (${{ matrix.preset }})
        needs: validate
        timeout-minutes: 40

        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-latest
                      preset: windows-msvc-release
                      msvc-setup-needed: true
                      artifact: claude-chats-browser-windows-x86_64
                      archive: zip

                    - os: ubuntu-latest
                      preset: linux-gcc-release
                      artifact: claude-chats-browser-linux-x86_64
                      archive: tar.gz

                    - os: macos-latest
                      preset: macos-clang-release
                      artifact: claude-chats-browser-macos-arm64
                      archive: tar.gz

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install Qt runtime dependencies (Linux)
              if: runner.os == 'Linux'
              run: >
                sudo apt-get update && sudo apt-get install -y
                libgl1-mesa-dev libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0
                libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-cursor0
                libxcb-xinerama0 libfontconfig1

            - name: Setup Qt
              uses: ./.github/actions/setup-qt
              with:
                version: ${{ env.QT_VERSION }}

            # Imports the vcvars64 environment directly (this repository's Actions
            # policy only allows actions owned by MatejGomboc or GitHub, which rules
            # out the usual ilammy/msvc-dev-cmd).
            - name: Setup MSVC environment
              if: matrix.msvc-setup-needed
              shell: pwsh
              run: |
                $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
                $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
                cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul 2>&1 && set" | ForEach-Object {
                    if ($_ -match '^([^=]+)=(.*)$') {
                        Add-Content $env:GITHUB_ENV "$($matches[1])=$($matches[2])"
                    }
                }

            # No caching for release builds - they're one-off events triggered by
            # version tags, so caches would never be reused and just waste storage

            - name: Configure
              run: cmake --preset ${{ matrix.preset }}

            - name: Build release binary
              run: cmake --build --preset ${{ matrix.preset }} --verbose

            # The install step runs the Qt deploy script (windeployqt / macdeployqt),
            # producing a self-contained directory on Windows and macOS. On Linux the
            # deploy script is a no-op (unsupported platform), so the archive carries
            # the bare binary and relies on distro Qt packages.
            - name: Install and deploy
              run: cmake --install build/${{ matrix.preset }}

            - name: Prepare artifact (Unix)
              if: runner.os != 'Windows'
              shell: bash
              run: |
                mkdir -p dist
                cp -R build/${{ matrix.preset }}-deploy/* dist/
                cp README.md LICENCE CHANGELOG.md dist/
                cd dist
                tar -czvf ../${{ matrix.artifact }}.tar.gz *

            - name: Prepare artifact (Windows)
              if: runner.os == 'Windows'
              shell: bash
              run: |
                mkdir -p dist
                cp -R build/${{ matrix.preset }}-deploy/* dist/
                cp README.md LICENCE CHANGELOG.md dist/
                cd dist
                7z a -tzip ../${{ matrix.artifact }}.zip *

            # A proper Windows installer alongside the plain zip: QtIFW's
            # binarycreator over the same deployed tree, driven by the same
            # script a developer runs locally (tools/build_installer.py).
            - name: Install Qt Installer Framework (Windows)
              if: runner.os == 'Windows'
              shell: bash
              run: |
                pipx run --spec "git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b" aqt install-tool \
                    windows desktop tools_ifw \
                    --base https://download.qt.io/ \
                    --outputdir "$HOME/Qt"

            - name: Build installer (Windows)
              if: runner.os == 'Windows'
              shell: bash
              run: |
                QTIFW_BIN=$(ls -d "$HOME"/Qt/Tools/QtInstallerFramework/*/bin | head -1)
                python tools/build_installer.py \
                    --deploy-dir build/${{ matrix.preset }}-deploy \
                    --output ${{ matrix.artifact }}-setup.exe \
                    --qtifw-bin "$QTIFW_BIN"

            - name: Upload artifact (Unix)
              if: runner.os != 'Windows'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                name: ${{ matrix.artifact }}
                path: ${{ matrix.artifact }}.tar.gz
                retention-days: 1

            - name: Upload artifact (Windows)
              if: runner.os == 'Windows'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                name: ${{ matrix.artifact }}
                path: |
                    ${{ matrix.artifact }}.zip
                    ${{ matrix.artifact }}-setup.exe
                retention-days: 1

    release:
        name: Create Release
        needs: [validate, build]
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Download all artifacts
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                path: artifacts

            - name: List artifacts
              run: find artifacts -type f

            - name: Generate checksums
              shell: bash
              run: |
                cd artifacts
                find . -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*-setup.exe" \) -exec mv {} . \;
                sha256sum *.tar.gz *.zip *-setup.exe > SHA256SUMS.txt
                cat SHA256SUMS.txt

            - name: Attest build provenance
              uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
              with:
                subject-path: |
                    artifacts/*.tar.gz
                    artifacts/*.zip
                    artifacts/*-setup.exe

            - name: Extract release notes from CHANGELOG
              id: release-notes
              shell: bash
              run: |
                VERSION="${{ needs.validate.outputs.version }}"

                # Extract release notes for this version from CHANGELOG.md
                # Uses awk with index() for literal string matching (avoids regex escaping issues)
                awk -v ver="## [${VERSION}]" '
                    index($0, ver) == 1 { found=1; next }
                    found && /^## \[/ { exit }
                    found { print }
                ' CHANGELOG.md > release_notes.md

                # Trim leading/trailing blank lines
                sed -i '/./,$!d' release_notes.md
                sed -i ':a;/^[[:space:]]*$/{$d;N;ba}' release_notes.md

                if [[ -s release_notes.md ]]; then
                    echo "Found release notes in CHANGELOG.md:"
                else
                    echo "No CHANGELOG entry for ${VERSION}, using default"
                    echo "Release ${VERSION}" > release_notes.md
                fi

                echo "--- Release Notes ---"
                cat release_notes.md

            - name: Create GitHub Release
              shell: bash
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                TAG="${{ needs.validate.outputs.tag }}"
                VERSION="${{ needs.validate.outputs.version }}"

                # Determine if this is a prerelease
                PRERELEASE_FLAG=""
                LATEST_FLAG="--latest"
                if [[ "$VERSION" == *-* ]]; then
                    PRERELEASE_FLAG="--prerelease"
                    LATEST_FLAG=""
                fi

                # Create the release with gh CLI (more reliable than third-party actions)
                gh release create "$TAG" \
                    --title "$TAG" \
                    --notes-file release_notes.md \
                    $LATEST_FLAG \
                    $PRERELEASE_FLAG \
                    artifacts/*.tar.gz \
                    artifacts/*.zip \
                    artifacts/*-setup.exe \
                    artifacts/SHA256SUMS.txt

                echo "Release created: $TAG"
